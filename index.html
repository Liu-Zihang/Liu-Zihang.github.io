    .ch-head { margin-bottom: 24px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .ch-eyebrow {
        font-family: var(--font-mono); font-size: 0.66rem;
        text-transform: uppercase; letter-spacing: 0.2em;
        color: var(--signal); display: inline-flex; align-items: center; gap: 8px;
    }
    .ch-eyebrow::before { content: ''; width: 18px; height: 1px; background: var(--signal); }
    .ch-title {
        font-family: var(--font-serif); font-weight: 400; font-size: 2.1rem;
        color: var(--ink); letter-spacing: -0.02em; line-height: 1;
        display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    }
    .ch-title em { font-style: italic; color: var(--signal-2); }
    .ch-title .count {
        font-family: var(--font-mono); font-size: 0.72rem;
        color: var(--ink-3); letter-spacing: 0.06em;
        font-style: normal; padding-bottom: 4px;
    }

    /* ============ Publications (cards) ============ */
    .publication {
        display: grid; grid-template-columns: 32px 170px 1fr;
        gap: 24px; padding: 22px 26px;
        background: var(--bg-1);
        border: 1px solid var(--rule);
        border-radius: 8px;
        margin-bottom: 14px;
        align-items: start;
        transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.3, 1), box-shadow 0.35s ease, border-color 0.35s ease;
    }
    .publication:last-child { margin-bottom: 0; }
    .publication:hover { border-color: rgba(31, 43, 209, 0.35); box-shadow: 0 20px 50px rgba(12, 18, 38, 0.10); }
    .publication.featured {
        border-color: rgba(31, 43, 209, 0.32);
        background: linear-gradient(135deg, var(--signal-soft) 0%, var(--bg-1) 55%);
    }
    .publication-num {
        font-family: var(--font-mono); font-size: 0.74rem;
        color: var(--ink-3); padding-top: 4px;
        font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
    }
    .publication.featured .publication-num { color: var(--signal); font-weight: 600; }
    .publication-preview {
        position: relative; width: 170px; aspect-ratio: 16 / 10;
        overflow: hidden; border: 1px solid var(--rule-2);
        background: var(--bg-2); border-radius: 3px;
    }
    .publication-preview img {
        width: 100%; height: 100%; object-fit: cover;
        filter: contrast(1.02);
        transition: transform 0.7s ease;
    }
    .publication:hover .publication-preview img { transform: scale(1.05); }
    .publication-content { min-width: 0; }
    .publication-meta {
        display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap;
    }
    .publication-venue {
        font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
        color: var(--signal); text-transform: uppercase; letter-spacing: 0.18em;
        display: inline-block; padding: 2px 8px;
        background: var(--signal-soft); border: 1px solid rgba(31, 43, 209, 0.2);
        border-radius: 2px;
    }
    .publication-badge {
        font-family: var(--font-mono); font-size: 0.6rem;
        color: var(--signal); letter-spacing: 0.14em; text-transform: uppercase;
        padding: 2px 7px; border-radius: 2px;
        border: 1px solid var(--signal);
        display: inline-flex; align-items: center; gap: 5px;
    }
    .publication-badge .pip {
        width: 4px; height: 4px; border-radius: 50%; background: var(--signal);
        animation: livePulse 1.6s ease-in-out infinite;
    }
    .publication-title {
        font-family: var(--font-serif); font-size: 1.35rem; font-weight: 400;
        line-height: 1.2; color: var(--ink); margin-bottom: 6px;
        letter-spacing: -0.012em;
    }
    .publication-authors {
        color: var(--ink-2); margin-bottom: 10px;
        font-size: 0.82rem; line-height: 1.55;
    }
    .publication-authors strong { color: var(--signal); font-weight: 600; }
    .publication-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .link-btn {
        display: inline-flex; align-items: center; gap: 6px;
        color: var(--ink-2); text-decoration: none;
        font-family: var(--font-mono); font-size: 0.72rem;
        letter-spacing: 0.04em;
        padding: 5px 10px;
        border: 1px solid var(--rule-2); border-radius: 3px;
        background: var(--bg-1);
        transition: all 0.25s ease;
    }
    .link-btn:hover {
        color: var(--signal); border-color: var(--signal);
        background: var(--signal-soft);
        box-shadow: 0 3px 10px var(--signal-glow);
    }
    .link-btn svg { width: 12px; height: 12px; }

    /* ============ Experience (compact) ============ */
    .experience-list { list-style: none; }
    .experience-entry {
        display: grid; grid-template-columns: 140px 48px 1fr; gap: 22px;
        padding: 16px 0; border-bottom: 1px dashed var(--rule); align-items: start;
    }
    .experience-entry:last-child { border-bottom: none; }
    .experience-date {
        font-family: var(--font-mono); font-size: 0.7rem;
        color: var(--ink-2); letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
        padding: 4px 8px; border: 1px solid var(--rule-2);
        border-radius: 3px; background: var(--bg-1);
        display: inline-block; height: fit-content; margin-top: 4px;
    }
    .experience-logo-wrap {
        width: 48px; height: 32px; display: flex; align-items: center; justify-content: center;
        background: var(--bg-1); border: 1px solid var(--rule); border-radius: 3px;
        padding: 4px;
    }
    .experience-logo { max-width: 100%; max-height: 100%; object-fit: contain; }
    .experience-title {
        font-family: var(--font-serif); font-size: 1.25rem; font-weight: 400;
        color: var(--ink); margin-bottom: 3px; line-height: 1.25;
        letter-spacing: -0.012em;
    }
    .experience-institution { font-size: 0.85rem; color: var(--ink-2); margin-bottom: 4px; }
    .experience-advisor {
        font-family: var(--font-mono); font-size: 0.7rem;
        color: var(--ink-3); letter-spacing: 0.02em;
    }
    .experience-advisor .arrow { color: var(--signal); margin-right: 6px; }

    /* ============ News (single column cards) ============ */
    .news-grid {
        display: flex; flex-direction: column;
        gap: 10px; list-style: none;
    }
    .news-item {
        padding: 14px 20px;
        background: var(--bg-1);
        border: 1px solid var(--rule); border-radius: 6px;
        display: grid; grid-template-columns: 110px 1fr; gap: 0 20px;
        align-items: baseline;
        transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.3, 1), box-shadow 0.35s ease, border-color 0.35s ease;
    }
    .news-item:hover { border-color: rgba(31, 43, 209, 0.3); box-shadow: 0 14px 36px rgba(12, 18, 38, 0.08); }
    .news-date {
        font-family: var(--font-mono); font-size: 0.7rem;
        color: var(--ink-3); font-weight: 500;
        letter-spacing: 0.04em; text-transform: uppercase;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }
    .news-content { font-size: 0.85rem; color: var(--ink-2); line-height: 1.55; }
    .news-content strong { color: var(--ink); font-weight: 600; }

    /* ============ Credits (Education + Awards) ============ */
    .credits-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
    }
    .credits-col h3 {
        font-family: var(--font-mono); font-size: 0.66rem;
        text-transform: uppercase; letter-spacing: 0.2em;
        color: var(--ink-3); margin-bottom: 12px;
        padding-bottom: 8px; border-bottom: 1px solid var(--rule);
    }

    .edu-entry { padding: 8px 0; }
    .edu-entry .head { display: flex; align-items: flex-start; gap: 12px; }
    .edu-logo {
        width: 34px; height: 34px; border-radius: 50%;
        object-fit: contain; background: var(--ink-2); padding: 4px;
        flex-shrink: 0;
    }
    .edu-school {
        font-family: var(--font-serif); font-size: 1.15rem; font-weight: 400;
        color: var(--ink); line-height: 1.25; margin-bottom: 2px;
    }
    .edu-years {
        font-family: var(--font-mono); font-size: 0.68rem;
        color: var(--ink-3); letter-spacing: 0.04em;
        margin-bottom: 5px;
    }
    .edu-major { font-size: 0.82rem; color: var(--ink-2); margin-bottom: 3px; }
    .edu-meta {
        font-family: var(--font-mono); font-size: 0.7rem;
        color: var(--ink-3); letter-spacing: 0.02em;
    }
    .edu-meta .rank {
        color: var(--signal); margin-left: 10px;
        background: var(--signal-soft); padding: 2px 7px; border-radius: 2px;
    }

    .awards-list { list-style: none; }
    .awards-list li {
        padding: 10px 0; border-bottom: 1px dashed var(--rule);
    }
    .awards-list li:last-child { border-bottom: none; }
    .award-name {
        font-family: var(--font-serif); font-size: 1.08rem;
        color: var(--ink); font-weight: 400; line-height: 1.35;
        margin-bottom: 3px;
    }
    .award-year {
        font-family: var(--font-mono); font-size: 0.66rem;
        color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase;
    }

    /* ============ Visitors ============ */
    .misc-globe { width: 220px; margin: 0 auto; display: block; }
    .misc-note {
        text-align: center; margin-top: 14px;
        font-family: var(--font-mono); font-size: 0.66rem;
        color: var(--ink-3); letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* ============ Footer ============ */
    footer {
        padding: 40px 32px 36px; text-align: center;
        border-top: 1px solid var(--rule); position: relative;
    }
    footer::before {
        content: ''; position: absolute; top: -1px; left: 50%; transform: translateX(-50%);
        width: 100px; height: 1px;
        background: linear-gradient(90deg, transparent, var(--signal), transparent);
        opacity: 0.45;
    }
    .footer-bars {
        display: flex; justify-content: center; gap: 3px; height: 20px;
        margin-bottom: 14px;
    }
    .footer-bars i {
        width: 2px; background: var(--ink-4); border-radius: 1px;
        animation: barPulse 2.2s ease-in-out infinite;
    }
    .copyright {
        font-family: var(--font-mono); font-size: 0.7rem;
        color: var(--ink-3); letter-spacing: 0.06em;
    }
    .copyright a {
        color: var(--ink-2); text-decoration: none;
        border-bottom: 1px solid var(--rule-2);
    }
    .copyright a:hover { color: var(--signal); border-color: var(--signal); }

    /* ============ Tilt + Signal Glow (cursor-driven) ============ */
    .tilt-glow {
        position: relative;
        transform-style: preserve-3d;
        will-change: transform;
    }
    .tilt-glow::after {
        content: ''; position: absolute; inset: 0;
        border-radius: inherit; pointer-events: none;
        background: radial-gradient(circle 280px at var(--glow-x, -9999px) var(--glow-y, -9999px),
                    rgba(31, 43, 209, 0.20),
                    rgba(109, 40, 217, 0.08) 32%,
                    transparent 62%);
        opacity: 0;
        transition: opacity 0.35s ease;
        z-index: 1;
    }
    .tilt-glow:hover {
        transform: perspective(1100px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateZ(0);
        z-index: 5;
    }
    .tilt-glow:hover::after { opacity: 1; }
    /* keep content above the glow */
    .tilt-glow > * { position: relative; z-index: 2; }
    /* photo-specific: stronger tilt + ring glow accent */
    .hero-photo.tilt-glow:hover { box-shadow: 0 28px 64px rgba(31, 43, 209, 0.22); }
    .hero-photo.tilt-glow::after {
        background: radial-gradient(circle 220px at var(--glow-x, -9999px) var(--glow-y, -9999px),
                    rgba(94, 234, 212, 0.22),
                    rgba(31, 43, 209, 0.14) 30%,
                    transparent 60%);
    }
    .publication.featured.tilt-glow::after {
        background: radial-gradient(circle 320px at var(--glow-x, -9999px) var(--glow-y, -9999px),
                    rgba(109, 40, 217, 0.25),
                    rgba(31, 43, 209, 0.10) 32%,
                    transparent 62%);
    }

    /* ============ Placeholder (no image) ============ */
    .publication-preview.placeholder,
    .np-thumb.placeholder {
        background: linear-gradient(135deg, #ece7d4 0%, #d8d0b6 100%);
        display: flex; align-items: center; padding: 10px 12px;
        gap: 2px; overflow: hidden;
    }
    .publication-preview.placeholder i,
    .np-thumb.placeholder i {
        display: block; width: 2.5px;
        background: var(--signal-grad);
        opacity: 0.6; border-radius: 1px;
        animation: barPulse 2.2s ease-in-out infinite;
    }
    .np-thumb.placeholder { padding: 8px 10px; }
    .np-thumb.placeholder i { width: 2px; opacity: 0.7; }
    .publication-preview.placeholder::after {
        content: 'audio · preview'; position: absolute;
        top: 6px; right: 6px;
        font-family: var(--font-mono); font-size: 0.54rem;
        color: var(--signal); letter-spacing: 0.14em; text-transform: uppercase;
        background: var(--bg-1); padding: 2px 6px; border-radius: 2px;
        border: 1px solid rgba(31, 43, 209, 0.22);
    }

    .publication-links:empty { display: none; }

    /* ============ Broadcast ticker + oscilloscope ============ */
    .broadcast {
        max-width: 1040px; margin: 0 auto 8px;
        padding: 0 32px;
        display: flex; align-items: stretch; gap: 14px;
    }
    .broadcast-label {
        flex-shrink: 0;
        display: inline-flex; align-items: center; gap: 9px;
        padding: 0 16px;
        font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.22em;
        color: var(--live);
        background: var(--bg-1);
        border: 1px solid var(--rule-2); border-radius: 4px;
        position: relative; overflow: hidden;
    }
    .broadcast-label::before {
        content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
        background: var(--live);
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.45);
    }
    .broadcast-label .pip {
        width: 7px; height: 7px; border-radius: 50%; background: var(--live);
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        animation: livePulse 1.1s ease-in-out infinite;
    }
    .broadcast-content {
        flex: 1; position: relative; height: 58px;
        background: var(--bg-1); border: 1px solid var(--rule-2);
        border-radius: 4px; overflow: hidden;
    }
    .broadcast-content .osc {
        position: absolute; inset: 0; width: 100%; height: 100%;
        opacity: 0.28; pointer-events: none; z-index: 1;
    }
    .ticker {
        position: relative; height: 100%; overflow: hidden; z-index: 2;
        display: flex; align-items: center;
    }
    .ticker::before, .ticker::after {
        content: ''; position: absolute; top: 0; bottom: 0;
        width: 72px; pointer-events: none; z-index: 3;
    }
    .ticker::before { left: 0; background: linear-gradient(90deg, var(--bg-1), rgba(255,255,255,0)); }
    .ticker::after  { right: 0; background: linear-gradient(-90deg, var(--bg-1), rgba(255,255,255,0)); }
    .ticker-track {
        display: inline-flex; gap: 48px; padding-left: 24px;
        white-space: nowrap; will-change: transform;
        animation: tickerScroll 52s linear infinite;
    }
    .ticker:hover .ticker-track { animation-play-state: paused; }
    @keyframes tickerScroll {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
    }
    .ticker-item {
        color: var(--ink-2); text-decoration: none;
        font-family: var(--font-mono); font-size: 0.78rem;
        letter-spacing: 0.02em; display: inline-flex; align-items: baseline; gap: 8px;
        transition: color 0.25s ease;
    }
    .ticker-item .arrow { color: var(--signal); font-weight: 600; }
    .ticker-item .t-title { color: var(--ink); font-weight: 500; }
    .ticker-item .t-venue {
        color: var(--ink-3); font-size: 0.66rem; letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 2px 7px; border: 1px solid var(--rule-2); border-radius: 2px;
    }
    .ticker-item:hover .t-title { color: var(--signal); }
    .ticker-item:hover .t-venue { color: var(--signal); border-color: var(--signal); }

    /* ============ Inline audio-mark (animated on hover of interactive elements) ============ */
    .audio-mark {
        display: inline-flex; align-items: center; gap: 2px;
        height: 0.9em; margin-left: 6px;
        vertical-align: -0.05em;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
    }
    .audio-mark i {
        display: block; width: 1.6px; height: 100%;
        background: var(--signal); border-radius: 1px;
        transform: scaleY(0.32); transform-origin: center;
    }
    /* Show + animate when the host element is hovered/focused */
    a:hover > .audio-mark,
    a:focus-visible > .audio-mark,
    button:hover > .audio-mark,
    button:focus-visible > .audio-mark,
    .interest-chip:hover > .audio-mark,
    .ticker-item:hover > .audio-mark,
    .nav-logo:hover > .audio-mark { opacity: 1; }

    a:hover > .audio-mark i,
    a:focus-visible > .audio-mark i,
    button:hover > .audio-mark i,
    button:focus-visible > .audio-mark i,
    .interest-chip:hover > .audio-mark i,
    .ticker-item:hover > .audio-mark i,
    .nav-logo:hover > .audio-mark i {
        animation: audioMarkEq 0.85s ease-in-out infinite;
    }
    .audio-mark i:nth-child(2) { animation-delay: 0.14s; }
    .audio-mark i:nth-child(3) { animation-delay: 0.28s; }
    .audio-mark i:nth-child(4) { animation-delay: 0.42s; }
    @keyframes audioMarkEq {
        0%, 100% { transform: scaleY(0.30); }
        50%      { transform: scaleY(1);   }
    }
    /* Tinted variant for elements on a signal-soft background */
    .ticker-item:hover > .audio-mark i { background: var(--signal); }

    /* ============ Click ripple (voice ping) ============ */
    .click-ripple {
        position: fixed; pointer-events: none;
        width: 10px; height: 10px;
        border-radius: 50%; border: 1.5px solid var(--signal);
        transform: translate(-50%, -50%);
        animation: ripplePing 0.75s cubic-bezier(0.18, 0.7, 0.3, 1) forwards;
        z-index: 9997;
    }
    @keyframes ripplePing {
        0%   { width: 10px; height: 10px; opacity: 0.9; border-width: 1.5px; }
        70%  { opacity: 0.4; }
        100% { width: 180px; height: 180px; opacity: 0; border-width: 0.5px; }
    }

    /* Magnetic icons — disable CSS hover transform so JS magnetic owns it */
    .icon-btn { transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease, transform 0.2s cubic-bezier(0.2, 0.6, 0.3, 1); }
    .icon-btn:hover { transform: none; } /* override; magnetic sets transform inline */

    /* Aurora follows mouse */
    body::after {
        transform: translateX(calc(-50% + var(--aurora-x, 0px))) translateY(var(--aurora-y, 0px));
        transition: transform 0.4s ease-out;
    }

    @media (max-width: 760px) {
        .broadcast { padding: 0 22px; gap: 10px; }
        .broadcast-label { padding: 0 12px; font-size: 0.62rem; letter-spacing: 0.18em; }
        .broadcast-content { height: 52px; }
        .ticker-item { font-size: 0.72rem; gap: 6px; }
        .ticker-item .t-venue { display: none; }
    }

    /* ============ Mobile menu icon ============ */
    .mobile-menu-btn { display: none; background: none; border: none; cursor: pointer; padding: 6px; }
    .mobile-menu-btn span { display: block; width: 20px; height: 1.5px; background: var(--ink); margin: 5px 0; }

    /* ============ Responsive ============ */
    @media (max-width: 900px) {
        .hero { padding: 4px 22px 22px; }
        .hero-spread { grid-template-columns: 1fr 180px; gap: 32px; }
        .hero-photo { width: 180px; }
        .hero-bio { grid-template-columns: 1fr 200px; gap: 36px; padding-top: 28px; }
        .transport { padding: 72px 22px 12px; }
        .zone-divider { padding: 0 22px; }
        section.ch { padding: 36px 22px 28px; }
    }
    @media (max-width: 760px) {
        .nav-links { display: none; }
        .mobile-menu-btn { display: block; }
        .nav-container { padding: 0 22px; max-width: 100%; }
        .transport { padding: 70px 22px 10px; font-size: 0.62rem; gap: 10px; }
        .transport .meta { display: none; }

        .hero-spread {
            grid-template-columns: 1fr; gap: 22px;
            padding-bottom: 28px;
        }
        .hero-photo { width: 150px; order: -1; justify-self: center; }
        .hero-name { font-size: clamp(2.6rem, 11vw, 4rem); text-align: center; }
        .hero-wave { justify-content: center; max-width: 100%; }
        .hero-tagline { text-align: center; font-size: 1.1rem; }

        .hero-bio {
            grid-template-columns: 1fr; gap: 28px; padding-top: 24px;
        }
        .dash-contact { justify-content: flex-start; }

        .ch-title { font-size: 1.6rem; }
        .publication { grid-template-columns: 1fr; gap: 12px; }
        .publication-num { display: none; }
        .publication-preview { width: 100%; aspect-ratio: 16 / 9; }
        .publication-title { font-size: 1.2rem; }
        .publication:hover { padding-left: 0; }

        .experience-entry { grid-template-columns: 1fr; gap: 8px; }
        .experience-logo-wrap { display: none; }

        .news-item { grid-template-columns: 1fr; gap: 6px; padding: 12px 16px 14px; }

        .credits-grid { grid-template-columns: 1fr; gap: 32px; }
    }

    /* ============ Fade-in ============ */
    .fade-in { opacity: 0; transform: translateY(10px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .fade-in.visible { opacity: 1; transform: translateY(0); }

    /* ============ WeChat Modal ============ */
    .wechat-modal {
        display: none; position: fixed; inset: 0;
        background: rgba(12, 18, 38, 0.42); z-index: 2000;
        justify-content: center; align-items: center;
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .wechat-modal.show { display: flex; }
    .wechat-modal-content {
        background: var(--bg-1); padding: 32px;
        text-align: center; position: relative;
        border: 1px solid var(--rule-2); border-radius: 6px;
        box-shadow: 0 30px 90px rgba(12, 18, 38, 0.18);
        animation: modalFadeIn 0.4s ease;
    }
    @keyframes modalFadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to   { opacity: 1; transform: scale(1); }
    }
    .wechat-modal-content img {
        width: 280px; height: 280px; object-fit: contain;
        border: 1px solid var(--rule);
    }

// Waveform / spectrogram / progress generators
function makeWaveform(count, opts = {}) {
    const minH = opts.minH ?? 6;
    const maxH = opts.maxH ?? 28;
    let html = '';
    for (let i = 0; i < count; i++) {
        const phase = (i / count) * Math.PI * 4;
        const base  = (Math.sin(phase) * 0.4 + 0.5);
        const noise = Math.random() * 0.5;
        const h = Math.round(minH + (maxH - minH) * (base * 0.6 + noise * 0.4));
        const d = -(Math.random() * 1.6).toFixed(2);
        html += `<i style="height:${h}px;animation-delay:${d}s"></i>`;
    }
    return html;
}
function makeMiniBars(count = 4) {
    let html = '';
    for (let i = 0; i < count; i++) {
        const h = 4 + Math.floor(Math.random() * 7);
        html += `<i style="height:${h}px"></i>`;
    }
    return html;
}
function makeSpectroBars(count = 40) {
    let html = '';
    for (let i = 0; i < count; i++) {
        const phase = (i / count) * Math.PI * 5;
        const base  = (Math.sin(phase) * 0.4 + 0.5);
        const noise = Math.random() * 0.55;
        const h = Math.round(15 + 70 * (base * 0.55 + noise * 0.45));
        const d = -(Math.random() * 2.2).toFixed(2);
        html += `<i style="height:${h}%;animation-delay:${d}s"></i>`;
    }
    return html;
}
function renderPreview(p, klass) {

    }
    return `<div class="${klass} placeholder" aria-label="audio preview">${makeSpectroBars(32)}</div>`;
}
function makeProgressBars(count, playedRatio = 0.45) {
    let html = ''; const cutoff = Math.floor(count * playedRatio);
    for (let i = 0; i < count; i++) {
        const phase = (i / count) * Math.PI * 5;
        const base  = (Math.sin(phase) * 0.45 + 0.55);
        const noise = Math.random() * 0.45;
        const h = Math.round(3 + 16 * (base * 0.6 + noise * 0.4));
        const cls = i < cutoff ? 'played' : '';
        html += `<i class="${cls}" style="height:${h}px"></i>`;
    }
    return html;
}

// ============ Scroll progress bar ============
(function scrollProgress() {
    const bar = document.getElementById('scrollProgress');
    if (!bar) return;
    let ticking = false;
    function update() {
        const h = document.documentElement;
        const max = h.scrollHeight - h.clientHeight;
        const ratio = max > 0 ? (h.scrollTop / max) : 0;
        bar.style.width = (ratio * 100) + '%';
        ticking = false;
    }
    window.addEventListener('scroll', () => {
        if (!ticking) { requestAnimationFrame(update); ticking = true; }
    }, { passive: true });
    update();
})();

// ============ Stats count-up ============
(function statsCountUp() {
    const values = document.querySelectorAll('.dash-stat .value');
    if (!values.length) return;
    function animate(el) {
        const target = parseInt(el.dataset.target, 10);
        if (isNaN(target)) return;
        const dur = 1100; const start = performance.now();
        function step(now) {
            const t = Math.min(1, (now - start) / dur);
            const eased = 1 - Math.pow(1 - t, 3);
            el.textContent = String(Math.floor(target * eased)).padStart(2, '0');
            if (t < 1) requestAnimationFrame(step);
            else el.textContent = String(target).padStart(2, '0');
        }
        requestAnimationFrame(step);
    }
    const io = new IntersectionObserver((entries) => {
        entries.forEach(en => { if (en.isIntersecting) { animate(en.target); io.unobserve(en.target); } });
    }, { threshold: 0.5 });
    values.forEach(v => io.observe(v));
})();

// ============ Oscilloscope: multi-frequency sine wave morph (rAF) ============
(function oscilloscope() {
    const path = document.getElementById('oscPath');
    if (!path) return;
    const W = 1000, H = 56, mid = H / 2;
    const N = 110;
    let t = 0;
    function frame() {
        t += 1;
        let d = '';
        for (let i = 0; i <= N; i++) {
            const x = (i / N) * W;
            // Stack 3 sines at different frequencies → looks like real speech
            const y = mid
                + Math.sin(i * 0.16 + t * 0.045) * 9
                + Math.sin(i * 0.34 + t * 0.062) * 5
                + Math.sin(i * 0.07 + t * 0.022) * 7;
            d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
        }
        path.setAttribute('d', d);
        requestAnimationFrame(frame);
    }
    frame();
})();

    const r = document.createElement('span');
    r.className = 'click-ripple';
    r.style.left = e.clientX + 'px';
    r.style.top  = e.clientY + 'px';
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 800);
});

// ============ Magnetic icons (contact buttons) ============
(function magneticIcons() {
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    const STR = 0.35;
    document.querySelectorAll('.icon-btn').forEach(el => {
        el.addEventListener('mousemove', e => {
            const r = el.getBoundingClientRect();
            const x = e.clientX - r.left - r.width / 2;
            const y = e.clientY - r.top  - r.height / 2;
            el.style.transform = `translate(${x * STR}px, ${y * STR}px)`;
        });
        el.addEventListener('mouseleave', () => { el.style.transform = ''; });
    });
})();

// ============ Tilt + Signal Glow (cursor-driven) — inspired by arctanxarc.github.io
function applyTiltGlow(selector, tiltDeg = 4) {
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    document.querySelectorAll(selector).forEach(el => {
        el.classList.add('tilt-glow');
        el.addEventListener('mousemove', e => {
            const r = el.getBoundingClientRect();
            const px = (e.clientX - r.left) / r.width - 0.5;
            const py = (e.clientY - r.top)  / r.height - 0.5;
            el.style.setProperty('--rx', (-py * tiltDeg).toFixed(2) + 'deg');
            el.style.setProperty('--ry', ( px * tiltDeg).toFixed(2) + 'deg');
            el.style.setProperty('--glow-x', (e.clientX - r.left) + 'px');
            el.style.setProperty('--glow-y', (e.clientY - r.top)  + 'px');
        });
        el.addEventListener('mouseleave', () => {
            el.style.removeProperty('--rx');
            el.style.removeProperty('--ry');
            el.style.removeProperty('--glow-x');
            el.style.removeProperty('--glow-y');
        });
    });
}
applyTiltGlow('.hero-photo',  6);
applyTiltGlow('.publication', 3.5);
applyTiltGlow('.news-item',   4.5);

// ============ Aurora parallax follow ============
(function auroraFollow() {
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    let pending = false; let tx = 0, ty = 0;
    document.addEventListener('mousemove', e => {
        tx = (e.clientX / window.innerWidth  - 0.5) * 60;
        ty = (e.clientY / window.innerHeight - 0.5) * 36;
        if (pending) return;
        pending = true;
        requestAnimationFrame(() => {
            document.body.style.setProperty('--aurora-x', tx.toFixed(1) + 'px');
            document.body.style.setProperty('--aurora-y', ty.toFixed(1) + 'px');
            pending = false;
        });
    }, { passive: true });
})();

// ============ Visitor globe ============
function initVisitorGlobe() {
    const host = document.getElementById('miscVisitorGlobe');
    if (!host || !DATA.visitorGlobeToken) return;
    const script = document.createElement('script');
    script.id = 'clstr_globe';
    script.type = 'text/javascript';
    script.src = `https://clustrmaps.com/globe.js?d=${encodeURIComponent(DATA.visitorGlobeToken)}`;
    host.appendChild(script);
}
initVisitorGlobe();

// ============ Smooth scroll ============
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
        const href = this.getAttribute('href');
        if (href === '#' || href === '') return;
        const target = document.querySelector(href);
        if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth' }); }
    });
});

// ============ WeChat modal ============
function showWechatQR() {
    document.getElementById('wechatModal').classList.add('show');
    document.body.style.overflow = 'hidden';
}
function hideWechatQR() {
    document.getElementById('wechatModal').classList.remove('show');
    document.body.style.overflow = '';
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideWechatQR(); });
</script>
